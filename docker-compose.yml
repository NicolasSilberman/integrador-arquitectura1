# Sistema de expensas — TP Integrador · Arquitectura de Software 1
# Un solo comando levanta todo:   docker compose up -d --build

services:

  # Base de datos. No publica puertos: solo la ven los servicios de la red "backend".
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-expensas}
      POSTGRES_USER: ${DB_USER:-expensas}
      POSTGRES_PASSWORD: "${DB_PASSWORD:?Falta DB_PASSWORD, copiá .env.example como .env}"   # la contraseña vive en .env, que NO se sube al repo
    volumes:
      - pgdata:/var/lib/postgresql/data   # volumen con nombre: los datos sobreviven a los contenedores
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro   # bind mount: script que corre la primera vez
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - backend

  # API de expensas (monolito modular). Se construye desde ./api (Dockerfile propio).
  api:
    build: ./api
    environment:
      PORT: 3000
      DB_HOST: db          # service discovery: el nombre del servicio ES el hostname
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-expensas}
      DB_USER: ${DB_USER:-expensas}
      DB_PASSWORD: "${DB_PASSWORD:?Falta DB_PASSWORD, copiá .env.example como .env}"
      BANCO_URL: http://banco-mock:8090/soap   # el banco se alcanza por nombre de servicio
    ports:
      - "3000:3000"        # puerto_host:puerto_contenedor
    depends_on:
      db:
        condition: service_healthy   # espera a que Postgres responda, no solo a que arranque
    networks:
      - backend

  # Proveedor de identidad OIDC (login y roles), ADR-005. Modo desarrollo: sin HTTPS.
  keycloak:
    image: quay.io/keycloak/keycloak:26.2.5
    command: ["start-dev", "--import-realm"]          # importa el realm "expensas" la primera vez
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin              # usuario de la consola de administración
      KC_BOOTSTRAP_ADMIN_PASSWORD: "${KEYCLOAK_ADMIN_PASSWORD:?Falta KEYCLOAK_ADMIN_PASSWORD, copiala de .env.example a tu .env}"
      KC_HEALTH_ENABLED: "true"
    volumes:
      - ./keycloak:/opt/keycloak/data/import:ro       # bind mount: el realm versionado en el repo
    ports:
      - "8180:8080"                                    # 8080 ya lo usa swagger-ui en el host
    healthcheck:
      # La imagen no trae curl: se le pega al endpoint de salud (puerto 9000) con bash
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q UP <&3"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s
    networks:
      - identidad

  # Banco SIMULADO: hace de servicio SOAP heredado del banco (sistema externo, ADR-003).
  # Solo para desarrollo y demo; en producción se reemplaza por el banco real.
  banco-mock:
    build: ./banco-mock
    environment:
      PORT: 8090
    ports:
      - "8090:8090"        # publicado para poder probarlo desde el navegador
    networks:
      - backend

  # Documentación autogenerada a partir del contrato OpenAPI.
  # No está en "backend": no necesita hablar con nadie. Quien llama a la API es tu navegador.
  swagger-ui:
    image: swaggerapi/swagger-ui:v5.17.14
    environment:
      SWAGGER_JSON: /spec/openapi.yaml
    volumes:
      - ./openapi.yaml:/spec/openapi.yaml:ro   # bind mount: editás el contrato y recargás, sin rebuild
    ports:
      - "8080:8080"

volumes:
  pgdata:

networks:
  backend:
  identidad:
