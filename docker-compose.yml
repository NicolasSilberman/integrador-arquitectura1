# Sistema de expensas — TP Integrador · Arquitectura de Software 1
# Un solo comando levanta todo:   docker compose up -d --build

services:

  # Base de datos. No publica puertos: solo la ven los servicios de la red "backend".
  db:
    image: postgres:16-alpine
    restart: unless-stopped   # si el proceso se cae, Docker lo vuelve a levantar (sin guardia; ver la sección 12)
    environment:
      POSTGRES_DB: ${DB_NAME:-expensas}
      POSTGRES_USER: ${DB_USER:-expensas}
      POSTGRES_PASSWORD: "${DB_PASSWORD:?Falta DB_PASSWORD, copiá .env.example como .env}"   # superusuario: solo para inicializar la base
      API_DB_PASSWORD: "${API_DB_PASSWORD:?Falta API_DB_PASSWORD, copiala de .env.example a tu .env}"   # la usa db/02-usuario-api.sh
    volumes:
      - pgdata:/var/lib/postgresql/data   # volumen con nombre: los datos sobreviven a los contenedores
      - ./db:/docker-entrypoint-initdb.d:ro   # bind mount: los scripts de db/ corren en orden la primera vez
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - backend

  # API de expensas (monolito modular). Se construye desde ./api (Dockerfile propio).
  api:
    build: ./api
    restart: unless-stopped
    environment:
      PORT: 3000
      DB_HOST: db          # service discovery: el nombre del servicio ES el hostname
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-expensas}
      DB_USER: api_expensas                    # usuario propio, con permisos mínimos (ADR-008)
      DB_PASSWORD: "${API_DB_PASSWORD:?Falta API_DB_PASSWORD, copiala de .env.example a tu .env}"
      BANCO_URL: http://banco-mock:8090/soap   # el banco se alcanza por nombre de servicio
      BANCO_API_KEY: "${BANCO_API_KEY:?Falta BANCO_API_KEY, copiala de .env.example a tu .env}"   # ADR-010
      # Conciliación automática diaria (ADR-004). Para probarla sin esperar a mañana, poner una hora ya pasada.
      CONCILIACION_AUTOMATICA: "${CONCILIACION_AUTOMATICA:-true}"
      CONCILIACION_HORA: "${CONCILIACION_HORA:-07:00}"           # hora de Argentina desde la que corre
      CONCILIACION_REINTENTO_MIN: "${CONCILIACION_REINTENTO_MIN:-30}"   # espera antes de reintentar si el banco falló
      CONCILIACION_MAX_DIAS: "${CONCILIACION_MAX_DIAS:-7}"         # cuántos días atrasados se pone al día como máximo
    # Sin puerto publicado: desde afuera solo se llega por el gateway (ADR-006)
    depends_on:
      db:
        condition: service_healthy   # espera a que Postgres responda, no solo a que arranque
    networks:
      - backend

  # Gateway: la ÚNICA puerta de entrada a la API (ADR-006). Valida el token, aplica los permisos
  # por rol y reenvía la identidad del usuario a la API (X-Usuario, X-Roles).
  gateway:
    build: ./gateway
    restart: unless-stopped
    environment:
      PORT: 8000
      API_URL: http://api:3000                                                       # por la red backend
      JWKS_URL: http://keycloak:8080/realms/expensas/protocol/openid-connect/certs   # por la red identidad
      ISSUER: http://localhost:8180/realms/expensas   # el "iss" que pone Keycloak cuando el navegador entra por localhost:8180
      AUDIENCE: api-expensas
      CORS_ORIGIN: http://localhost:8080,http://localhost:3001   # Swagger UI y la interfaz web
    ports:
      - "8000:8000"
    depends_on:
      - api
      - keycloak       # alcanza con que arranque: las claves se piden recién con el primer token
    networks:
      - backend
      - identidad

  # Proveedor de identidad OIDC (login y roles), ADR-005. Modo desarrollo: sin HTTPS.
  keycloak:
    image: quay.io/keycloak/keycloak:26.2.5
    restart: unless-stopped
    command: ["start-dev", "--import-realm"]          # importa el realm "expensas" la primera vez
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin              # usuario de la consola de administración
      KC_BOOTSTRAP_ADMIN_PASSWORD: "${KEYCLOAK_ADMIN_PASSWORD:?Falta KEYCLOAK_ADMIN_PASSWORD, copiala de .env.example a tu .env}"
      KC_HEALTH_ENABLED: "true"
    volumes:
      - ./keycloak:/opt/keycloak/data/import:ro       # bind mount: el realm versionado en el repo
    ports:
      - "8180:8080"                                    # 8080 ya lo usa swagger-ui en el host
    healthcheck:
      # La imagen no trae curl: se le pega al endpoint de salud (puerto 9000) con bash
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q UP <&3"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s
    networks:
      - identidad

  # Banco SIMULADO: hace de servicio SOAP heredado del banco (sistema externo, ADR-003).
  # Solo para desarrollo y demo; en producción se reemplaza por el banco real.
  banco-mock:
    build: ./banco-mock
    restart: unless-stopped
    environment:
      PORT: 8090
      BANCO_API_KEY: "${BANCO_API_KEY:?Falta BANCO_API_KEY, copiala de .env.example a tu .env}"   # la clave que exige el servicio SOAP
    ports:
      - "8090:8090"        # publicado para usar la consola de demo desde el navegador
    networks:
      - backend

  # Documentación autogenerada a partir del contrato OpenAPI.
  # No está en "backend": no necesita hablar con nadie. Quien llama a la API es tu navegador.
  swagger-ui:
    image: swaggerapi/swagger-ui:v5.17.14
    restart: unless-stopped
    environment:
      SWAGGER_JSON: /spec/openapi.yaml
      OAUTH_CLIENT_ID: swagger-ui       # cliente público registrado en el realm (sin secreto)
      OAUTH_USE_PKCE: "true"            # Authorization Code + PKCE
      OAUTH_SCOPES: openid profile
    volumes:
      - ./openapi.yaml:/spec/openapi.yaml:ro   # bind mount: editás el contrato y recargás, sin rebuild
    ports:
      - "8080:8080"

  # Interfaz web (ADR-011): páginas estáticas (HTML + JS) que corren en el navegador.
  # Como Swagger UI, no necesita ninguna red interna: quien llama al gateway y a Keycloak es el navegador.
  web:
    image: nginxinc/nginx-unprivileged:1.27-alpine   # nginx sin root (ADR-008); escucha en el 8080
    restart: unless-stopped
    volumes:
      - ./web:/usr/share/nginx/html:ro   # bind mount: se edita la página y se recarga, sin rebuild
    ports:
      - "3001:8080"

volumes:
  pgdata:

networks:
  backend:
  identidad:
